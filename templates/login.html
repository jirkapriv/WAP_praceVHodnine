{% extends "layout.html" %}

{% block content %}
<h1>Login</h1>
<p>{{message}}</p>
<form method="post" action="" enctype="multipart/form-data">
  <p>
    <label>Username:<br/>
      <input name="username" required value="{{username}}">
    </label>
  </p>
  <p>
    <label>Password:<br/>
      <input type="password" name="password" required>
    </label>
  </p>
  <button>Login</button>
</form>
<p>OR</p>
<p>
  <a href="/register">Create new account</a>
</p>
{% endblock %}
